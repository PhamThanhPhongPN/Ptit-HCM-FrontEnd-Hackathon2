<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>

<body>
  <div class="box">
    <div class="container1">
      <h4>Quản Lý Sự Kiện</h4>
      <form onsubmit="addEvent(event)" class="form" id="form">
        <div class="smallbox1">
          <div>
            <p class="text">Tên sự kiện:</p>
            <input type="text" class="input" id="name" required onkeyup="check()">
            <p class="invalid" id="check1">Không được để trống</p>
            <p class="text">Địa điểm:</p>
            <input type="text" class="input" id="place" required onkeyup="check()">
            <p class="invalid" id="check2">Không được để trống</p>
          </div>
          <div>
            <p class="text">Ngày tổ chức:</p>
            <input type="date" class="input" id="date" required onkeyup="check()">
            <p class="invalid" id="check3">Vui lòng chọn ngày</p>
            <p class="text">Người tổ chức:</p>
            <input type="text" class="input" id="organizer" required onkeyup="check()">
            <p class="invalid" id="check4">Không được để trống</p>
          </div>
        </div>
        <button class="btn btn-success button" id="btn_add_save">Thêm sự kiện</button>
      </form>
    </div>
    <div class="container2">
          <input type="text" placeholder="Tìm kiếm theo tên sự kiện..." id="search" class="form2" required onkeyup="searchEvent()"> 
          <table class=" table table-bordered">
        <thead>
          <tr>
            <th scope="col">Tên sự kiện</th>
            <th scope="col">Ngày</th>
            <th scope="col">Địa điểm</th>
            <th scope="col">Người tổ chức</th>
            <th scope="col">Hành động</th>
          </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
        </table>
    </div>
  </div>
  <script src="main.js"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
    integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
    integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
    crossorigin="anonymous"></script>
</body>

</html>
